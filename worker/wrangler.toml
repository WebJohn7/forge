# Cloudflare Worker for Forge notifications — free tier (Workers + KV + Cron Triggers).
# Setup steps are in README.md → "Notifications".
name = "forge-push"
main = "index.js"
compatibility_date = "2026-09-01"

# Every 15 minutes. Each reminder fires once, in the first run at or after its time.
[triggers]
crons = ["*/15 * * * *"]

# Created with: npx wrangler kv namespace create FORGE (the id is not a secret).
[[kv_namespaces]]
binding = "FORGE"
id = "b920ed7712704232bae7eb7dff99d34a"
